{% extends "myapp/base.html"%}
{% block body %}
  <div class="max-w-3xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-10">
    <h1 class="text-4xl font-bold text-gray-800 mb-6 text-center">Edit  Item</h1>

    <!-- Debugging: Check if form is being passed -->
    <div class="mb-4">
      {% if form %}
        
      {% else %}
        <p class="text-red-600">Form is NOT being passed!</p>
      {% endif %}
    </div>

    <!-- Form Starts -->
    <form method="POST" enctype="multipart/form-data" class="space-y-8">
      {% csrf_token %}

      <!-- Loop through form fields -->
      {% for field in form %}
        <div class="flex flex-col">
          <label for="{{ field.id_for_label }}" class="text-lg font-semibold text-gray-700 mb-2">
            {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
          </label>

          <!-- Field rendering -->
          <div class="flex items-center">
            {{ field }}
          </div>

          <!-- Display errors -->
          {% if field.errors %}
            <p class="text-red-500 text-sm mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <!-- Submit Button -->
      <button 
        type="submit"
        class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-300 transform hover:scale-105">
        Save Item
      </button>
    </form>
    <!-- Form Ends -->

    <!-- Optional: Back to Home Link -->
    <div class="text-center mt-8">
      <a href="{% url 'myapp:index' %}" class="text-blue-500 hover:underline">Back to Home</a>
    </div>
  </div>
{% endblock %}
