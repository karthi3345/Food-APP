<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Food App</title>
</head>
<body>
     <nav class="bg-black text-white">
      <div class="flex justify-between px-4 py-2 ">
          <a href="{% url 'myapp:index' %}" class="font-bold m-2">FoodApp</a>
        <div class="space-x-6">
           <a href="{% url 'myapp:contact' %}">Contact</a>  <!-- no space inside quotes -->

            <a href="{% url 'myapp:address'%}">Address</a>
            <a href="{% url 'myapp:about' %}">About us</a>
            <a href="{% url "users:profile" %}">Welcome {{user.username}} !</a>
             <a href="{% url 'users:logout'%}">Logout </a>


        </div>
      </div>
    </nav>
    {% if messages %}
     {% for message in messages %}
     <div class="bg-green-500 text-green-700">
       {{message}}
     </div>
     {% endfor %}
    {% endif %}
    {% block body%}
    {% endblock %}
</body>
</html>
