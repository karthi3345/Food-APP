<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Navbar -->
    <nav class="bg-black text-white p-4 shadow">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'myapp:index' %}" class="text-xl font-bold">FoodApp</a>
            <div class="space-x-4">
                <a href="{% url 'myapp:contact' %}" class="hover:underline">Contact</a>
                <a href="{% url 'myapp:address' %}" class="hover:underline">Address</a>
                <a href="{% url 'myapp:about' %}" class="hover:underline">About us</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'users:profile' %}" class="hover:underline">Welcome {{ user.username }}!</a>
                    <a href="{% url 'users:logout' %}" class="hover:underline text-red-400">Logout</a>
                {% else %}
                    <a href="{% url 'users:login' %}" class="hover:underline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
        <div class="container mx-auto mt-4">
            {% for message in messages %}
                <div class="bg-green-200 text-green-800 p-3 rounded shadow mb-2">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Page Content -->
    <main class="container mx-auto py-8">
        {% block body %}{% endblock %}
    </main>
</body>
</html>
