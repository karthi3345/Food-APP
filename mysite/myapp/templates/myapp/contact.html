{% extends "myapp/base.html" %}
{% block body %}
<div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h1 class="text-4xl font-bold text-center mb-6 text-red-600">Contact Us</h1>

    <p class="text-gray-600 text-center mb-4">
        Have questions or need help? Fill out the form below and we will get back to you.
    </p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="name" class="block text-gray-700 mb-2">Your Name</label>
            <input type="text" id="name" name="name" class="w-full p-2 border rounded-lg" required>
        </div>

        <div>
            <label for="email" class="block text-gray-700 mb-2">Email</label>
            <input type="email" id="email" name="email" class="w-full p-2 border rounded-lg" required>
        </div>

        <div>
            <label for="message" class="block text-gray-700 mb-2">Message</label>
            <textarea id="message" name="message" class="w-full p-2 border rounded-lg" rows="4" required></textarea>
        </div>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-md transition">
            Send Message
        </button>
    </form>
</div>
{% endblock %}
