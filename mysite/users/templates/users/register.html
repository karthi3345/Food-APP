<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food App Registration - Zomato Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-4xl font-extrabold mb-8 text-red-600 text-center">Food App</h1>

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      
      <!-- Render form fields manually for labels and errors -->
      {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-gray-700 mb-2 font-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-600 text-sm mt-1">{{ field.errors }}</p>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-md transition">
        Sign Up
      </button>
    </form>

    <p class="mt-6 text-center text-gray-500">
      Already have an account?
      <a href="{% url 'users:login' %}" class="text-red-600 hover:underline font-semibold">Log In</a>
    </p>
  </div>

</body>
</html>
