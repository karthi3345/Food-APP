<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-4xl font-extrabold mb-6 text-red-600 text-center">Login</h1>

    <!-- Show success or error messages -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <p class="text-center {% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %}">
            {{ message }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Login form -->
    <form method="POST" action="{% url 'users:login' %}" class="space-y-6">
      {% csrf_token %}
      {% for field in form %}
      <div>
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <p class="text-red-600 text-sm mt-1">{{ field.errors }}</p>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-md transition">
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-gray-500">
      Don't have an account?
      <a href="{% url 'users:register' %}" class="text-red-600 hover:underline font-semibold">Sign Up</a>
    </p>
  </div>

</body>
</html>
