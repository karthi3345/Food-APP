<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logged Out</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

  <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md text-center">
 

    <!-- Show success message if any -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <p class="{% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %}">
            {{ message }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <p class="text-gray-600 mb-6">Thank you for visiting our site. You can log in again anytime.</p>

    <a href="{% url 'users:login' %}" 
       class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-md transition">
      Login Again
    </a>
  </div>

</body>
</html>
